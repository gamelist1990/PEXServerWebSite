<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The same build is served at the proxy root and the GitHub project path.
      const projectPath = "/PEXServerWebSite";
      const siteBase = document.createElement("base");
      siteBase.href = location.pathname === projectPath || location.pathname.startsWith(projectPath + "/")
        ? projectPath + "/" : "/";
      document.head.prepend(siteBase);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PEXserver の Minecraft サーバー情報、参加方法、ライブステータスをまとめた公式サイト。"
    />
    <meta property="og:title" content="PEXserver" />
    <meta
      property="og:description"
      content="PEXserver の Minecraft サーバー情報、参加方法、ライブステータスをまとめた公式サイト。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./server.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f3efe7" />
    <title>PEXserver</title>
    <link rel="icon" type="image/png" href="./server.png" />
    <link rel="apple-touch-icon" href="./server.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
